name: Deploy Quiz App to GitHub Pages

on:
  push:
    branches: ["main"]     # deploy every time you push to main
  workflow_dispatch:        # allow manual deployment

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # If your site is just static HTML/CSS/JS, no build is needed.
      # If you have a /dist folder created by a build step, include that build command here.
      # Example:
      # - name: Build
      #   run: npm install && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./   # publish root folder (your HTML, CSS, JS)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
